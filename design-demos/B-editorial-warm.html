<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大聪明硬件每日新鲜事</title>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #F7F3ED;
            --text: #1C1917;
            --muted: #78716C;
            --accent: #B45930;
            --rule: #E7E0D6;
        }
        body {
            font-family: 'Noto Sans SC', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
        }

        /* Masthead */
        .masthead {
            padding: 56px 24px 40px;
            text-align: center;
            border-bottom: 1px solid var(--rule);
        }
        .masthead h1 {
            font-family: 'Newsreader', serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .masthead .tagline {
            font-size: 13px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        /* Content */
        .content {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Day section */
        .day {
            padding: 40px 0;
            border-bottom: 1px solid var(--rule);
        }
        .day:last-child { border-bottom: none; }
        .day-date {
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 28px;
        }

        /* Item */
        .item { margin-bottom: 32px; }
        .item:last-child { margin-bottom: 0; }
        .item-label {
            font-family: 'Newsreader', serif;
            font-size: 12px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .item-label::before {
            content: '';
            display: block;
            width: 16px;
            height: 1.5px;
            background: var(--accent);
        }
        .item-title {
            font-family: 'Newsreader', serif;
            font-size: 22px;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }
        .item-title a {
            color: var(--text);
            text-decoration: none;
            transition: color 0.15s;
        }
        .item-title a:hover { color: var(--accent); }
        .item-summary {
            font-size: 15px;
            color: var(--muted);
            line-height: 1.75;
            text-wrap: pretty;
        }
        .item-meta {
            margin-top: 10px;
            font-size: 12px;
            color: var(--muted);
        }
        .item-meta a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
        .item-meta a:hover { text-decoration: underline; }

        /* Footer */
        .colophon {
            padding: 32px 24px 48px;
            text-align: center;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.5px;
        }

        @media (max-width: 640px) {
            .masthead h1 { font-size: 26px; }
            .item-title { font-size: 19px; }
        }
    </style>
</head>
<body>
    <div class="masthead">
        <h1>大聪明硬件每日新鲜事</h1>
        <p class="tagline">每天三条 · 海外消费硬件速递</p>
    </div>
    <main class="content" id="feed"></main>
    <div class="colophon">Product Hunt · Hacker News · Kickstarter · TechCrunch · Dezeen · Wired</div>

    <script>
    async function loadFeed() {
        const res = await fetch('./data.json');
        const days = await res.json();
        const feed = document.getElementById('feed');
        days.forEach(day => {
            const section = document.createElement('section');
            section.className = 'day';
            const d = new Date(day.date+'T00:00:00');
            const wk = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
            let html = `<div class="day-date">${day.date} · ${wk}</div>`;
            day.items.forEach((item, i) => {
                html += `
                <article class="item">
                    <div class="item-label">${item.source}</div>
                    <h2 class="item-title"><a href="${item.url}" target="_blank" rel="noopener">${item.title}</a></h2>
                    <p class="item-summary">${item.summary}</p>
                    <p class="item-meta"><a href="${item.url}" target="_blank" rel="noopener">阅读原文 →</a></p>
                </article>`;
            });
            section.innerHTML = html;
            feed.appendChild(section);
        });
    }
    loadFeed();
    </script>
</body>
</html>
