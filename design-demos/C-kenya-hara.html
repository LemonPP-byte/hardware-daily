<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大聪明硬件每日新鲜事</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #FAFAFA;
            --text: #111;
            --muted: #888;
            --light: #ccc;
        }
        body {
            font-family: 'Noto Sans SC', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
        }

        .page {
            max-width: 540px;
            margin: 0 auto;
            padding: 100px 24px 80px;
        }

        /* Header — minimal */
        header {
            margin-bottom: 80px;
        }
        header h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 0;
        }

        /* Day */
        .day {
            margin-bottom: 72px;
        }
        .day-date {
            font-size: 11px;
            font-weight: 300;
            color: var(--muted);
            letter-spacing: 3px;
            margin-bottom: 32px;
        }

        /* Item */
        .item {
            margin-bottom: 48px;
        }
        .item:last-child { margin-bottom: 0; }
        .item-title {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .item-title a {
            color: var(--text);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .item-title a:hover {
            border-bottom-color: var(--text);
        }
        .item-summary {
            font-size: 14px;
            font-weight: 300;
            color: #444;
            line-height: 2;
            text-wrap: pretty;
        }
        .item-source {
            margin-top: 12px;
            font-size: 11px;
            font-weight: 400;
            color: var(--light);
            letter-spacing: 0.5px;
        }
        .item-source a {
            color: var(--muted);
            text-decoration: none;
        }
        .item-source a:hover {
            color: var(--text);
        }

        /* Divider between items */
        .item + .item::before {
            content: '';
            display: block;
            width: 24px;
            height: 1px;
            background: var(--light);
            margin-bottom: 48px;
        }

        /* Footer */
        footer {
            padding-top: 40px;
            border-top: 1px solid #eee;
            font-size: 11px;
            font-weight: 300;
            color: var(--light);
        }

        @media (max-width: 640px) {
            .page { padding: 64px 20px 60px; }
            header { margin-bottom: 56px; }
            .item { margin-bottom: 36px; }
            .item + .item::before { margin-bottom: 36px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <h1>大聪明硬件每日新鲜事</h1>
        </header>
        <main id="feed"></main>
        <footer>Product Hunt · Hacker News · Kickstarter · TechCrunch · Dezeen · Wired</footer>
    </div>

    <script>
    async function loadFeed() {
        const res = await fetch('./data.json');
        const days = await res.json();
        const feed = document.getElementById('feed');
        days.forEach(day => {
            const section = document.createElement('section');
            section.className = 'day';
            const d = new Date(day.date+'T00:00:00');
            const wk = ['日','一','二','三','四','五','六'][d.getDay()];
            let html = `<div class="day-date">${day.date} ${wk}</div>`;
            day.items.forEach((item, i) => {
                html += `
                <article class="item">
                    <h2 class="item-title"><a href="${item.url}" target="_blank" rel="noopener">${item.title}</a></h2>
                    <p class="item-summary">${item.summary}</p>
                    <p class="item-source">${item.source} · <a href="${item.url}" target="_blank" rel="noopener">原文</a></p>
                </article>`;
            });
            section.innerHTML = html;
            feed.appendChild(section);
        });
    }
    loadFeed();
    </script>
</body>
</html>
