<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>硬件产品新鲜事</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --muted: #888;
            --accent: #E8652B;
            --card-bg: #f8f8f8;
            --card-border: #eee;
        }
        body {
            font-family: -apple-system, 'SF Pro Display', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        /* Header */
        header {
            padding: 32px 40px 24px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            border-bottom: 1px solid #f0f0f0;
        }
        header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        header h1 span { color: var(--accent); }
        .header-meta {
            font-size: 12px;
            color: var(--muted);
        }

        /* Day section */
        .day {
            padding: 28px 40px 36px;
            border-bottom: 1px solid #f0f0f0;
        }
        .day-date {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        /* Card grid - 5 columns */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
        }

        /* Card */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        .card a { text-decoration: none; color: inherit; }

        .card-img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            display: block;
            background: #eee;
        }
        .card-img-placeholder {
            width: 100%;
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            font-size: 11px;
            color: #bbb;
            text-align: center;
            padding: 12px;
        }

        .card-body {
            padding: 14px 14px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-tier {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-summary {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-source {
            font-size: 11px;
            color: var(--muted);
            font-weight: 500;
        }
        .card-score {
            display: flex;
            gap: 3px;
        }
        .card-score .bar {
            width: 12px;
            height: 3px;
            border-radius: 1.5px;
            background: #e0e0e0;
        }
        .card-score .bar.on { background: var(--accent); }

        .card-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 9px;
            font-weight: 700;
            background: var(--accent);
            color: #fff;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .card-img-wrap {
            position: relative;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .card-grid { grid-template-columns: repeat(3, 1fr); }
            .day { padding: 24px 24px 32px; }
            header { padding: 24px 24px 20px; }
        }
        @media (max-width: 768px) {
            .card-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .card-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <h1>硬件产品<span>新鲜事</span></h1>
        <span class="header-meta" id="meta"></span>
    </header>
    <main id="feed"></main>

    <script>
    async function loadFeed() {
        try {
            const res = await fetch('./data.json');
            const days = await res.json();
            const feed = document.getElementById('feed');
            const meta = document.getElementById('meta');

            if (days.length > 0) {
                meta.textContent = `更新于 ${days[0].date}`;
            }

            days.forEach(day => {
                const section = document.createElement('section');
                section.className = 'day';
                const d = new Date(day.date + 'T00:00:00');
                const wk = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];

                let html = `<div class="day-date">${day.date} · ${wk}</div>`;
                html += '<div class="card-grid">';

                day.items.forEach(item => {
                    const score = item.score || 3;
                    const bars = Array.from({length: 5}, (_, i) =>
                        `<span class="bar ${i < score ? 'on' : ''}"></span>`
                    ).join('');

                    const tier = item.tier || '新锐产品';
                    const badge = item.recurring ? '<span class="card-badge">热议</span>' : '';

                    // Image: use item.image if available, otherwise generate from article URL
                    const imgHtml = item.image
                        ? `<img class="card-img" src="${item.image}" alt="${item.title}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=card-img-placeholder>${item.source}</div>'">`
                        : `<div class="card-img-placeholder">${item.source}</div>`;

                    html += `
                    <article class="card">
                        <a href="${item.url}" target="_blank" rel="noopener">
                            <div class="card-img-wrap">
                                ${imgHtml}
                                ${badge}
                            </div>
                            <div class="card-body">
                                <div class="card-tier">${tier}</div>
                                <h3 class="card-title">${item.title}</h3>
                                <p class="card-summary">${item.summary}</p>
                                <div class="card-footer">
                                    <span class="card-source">${item.source}</span>
                                    <div class="card-score">${bars}</div>
                                </div>
                            </div>
                        </a>
                    </article>`;
                });

                html += '</div>';
                section.innerHTML = html;
                feed.appendChild(section);
            });
        } catch (err) {
            document.getElementById('feed').innerHTML =
                '<p style="color:#888;padding:60px;text-align:center">加载失败，请刷新</p>';
        }
    }
    loadFeed();
    </script>
</body>
</html>
