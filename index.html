<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图拉斯 · 硬件产品新鲜事</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f2f2f7;
            --text: #1c1c1e;
            --muted: #8e8e93;
            --accent: #E8652B;
            --glass: rgba(255,255,255,0.72);
            --glass-border: rgba(255,255,255,0.5);
            --card-glass: rgba(255,255,255,0.6);
            --card-border: rgba(0,0,0,0.04);
        }
        body {
            font-family: -apple-system, 'SF Pro Display', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* === Hero / Title Overlay === */
        .hero-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 22vh;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(242,242,247,0.95) 0%,
                rgba(242,242,247,0.85) 40%,
                rgba(242,242,247,0.4) 75%,
                rgba(242,242,247,0) 100%
            );
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .hero-title {
            font-size: clamp(32px, 5vw, 56px);
            font-weight: 900;
            letter-spacing: -1px;
            color: var(--text);
            opacity: 0.18;
            text-align: center;
            user-select: none;
        }
        .hero-title span { color: var(--accent); opacity: 0.6; }

        /* === Top bar (inside hero) === */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 200;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            pointer-events: auto;
        }
        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .top-bar-left svg { opacity: 0.8; }
        .top-bar-left span {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            opacity: 0.6;
        }
        .top-bar-right {
            font-size: 11px;
            color: var(--muted);
        }

        /* === Main content === */
        main {
            padding-top: 18vh;
            padding-bottom: 40px;
        }

        .day {
            padding: 16px 32px 32px;
        }
        .day-date {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 16px;
            padding-left: 4px;
        }

        /* === 4-column glass grid === */
        .tier-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .tier-col {}
        .tier-title {
            font-size: 20px;
            font-weight: 800;
            padding: 10px 14px;
            margin-bottom: 12px;
            border-radius: 10px;
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
        }
        .tier-col:nth-child(1) .tier-title { color: #2B7A4B; }
        .tier-col:nth-child(2) .tier-title { color: #0A7ABA; }
        .tier-col:nth-child(3) .tier-title { color: var(--accent); }
        .tier-col:nth-child(4) .tier-title { color: #6B5B8A; }

        /* === Glass Card === */
        .card {
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
        }
        .card a {
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .card-img {
            width: 100%;
            aspect-ratio: 16/10;
            object-fit: cover;
            display: block;
        }
        .card-img-placeholder {
            width: 100%;
            aspect-ratio: 16/10;
            background: linear-gradient(135deg, rgba(0,0,0,0.03), rgba(0,0,0,0.06));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #bbb;
        }
        .card-body { padding: 12px 14px 14px; }
        .card-title {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 6px;
        }
        .card-summary {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.7;
        }
        .card-footer {
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-source { font-size: 10px; color: var(--muted); font-weight: 500; }
        .card-score { display: flex; gap: 2px; }
        .card-score .bar {
            width: 10px; height: 3px; border-radius: 1.5px;
            background: rgba(0,0,0,0.08);
        }
        .card-score .bar.on { background: var(--accent); }
        .card-badge {
            position: absolute; top: 6px; right: 6px;
            font-size: 9px; font-weight: 700;
            background: var(--accent); color: #fff;
            padding: 2px 6px; border-radius: 4px;
        }
        .card-img-wrap { position: relative; }

        @media (max-width: 1200px) {
            .tier-grid { grid-template-columns: 1fr 1fr; }
            .day { padding: 16px 16px 24px; }
            .hero-overlay { height: 16vh; }
            main { padding-top: 14vh; }
        }
        @media (max-width: 640px) {
            .tier-grid { grid-template-columns: 1fr; }
            .hero-overlay { height: 12vh; }
            main { padding-top: 10vh; }
        }
    </style>
</head>
<body>
    <!-- Hero title overlay with fade -->
    <div class="hero-overlay">
        <div class="hero-title">图拉斯 · 硬件产品<span>新鲜事</span></div>
    </div>

    <!-- Top bar -->
    <div class="top-bar">
        <div class="top-bar-left">
            <svg width="28" height="28" viewBox="0 0 36 36" fill="none">
                <rect width="36" height="36" rx="8" fill="#E8652B"/>
                <path d="M20.5 8L13 19.5H17.5L15.5 28L23 16.5H18.5L20.5 8Z" fill="white"/>
            </svg>
            <span>图拉斯 · 硬件产品新鲜事</span>
        </div>
        <div class="top-bar-right" id="meta"></div>
    </div>

    <main id="feed"></main>

    <script>
    async function loadFeed() {
        try {
            const res = await fetch('./data.json?_=' + Date.now());
            const days = await res.json();
            const feed = document.getElementById('feed');
            const meta = document.getElementById('meta');
            if (days.length > 0) meta.textContent = `更新于 ${days[0].date}`;

            days.forEach(day => {
                const section = document.createElement('section');
                section.className = 'day';
                const d = new Date(day.date + 'T00:00:00');
                const wk = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];

                const tiers = { '成熟品牌': [], 'AI 硬件': [], '新锐产品': [], '野生灵感': [] };
                day.items.forEach(item => {
                    const t = item.tier || '新锐产品';
                    if (tiers[t]) tiers[t].push(item);
                    else tiers['新锐产品'].push(item);
                });

                let html = `<div class="day-date">${day.date} · ${wk}</div>`;
                html += '<div class="tier-grid">';

                const tierNames = ['成熟品牌', 'AI 硬件', '新锐产品', '野生灵感'];
                tierNames.forEach(tierName => {
                    const items = tiers[tierName] || [];
                    html += `<div class="tier-col">`;
                    html += `<div class="tier-title">${tierName}</div>`;
                    items.forEach(item => { html += renderCard(item); });
                    if (items.length === 0) {
                        html += '<p style="font-size:12px;color:#ccc;padding:20px 0;text-align:center">暂无</p>';
                    }
                    html += '</div>';
                });

                html += '</div>';
                section.innerHTML = html;
                feed.appendChild(section);
            });
        } catch (err) {
            document.getElementById('feed').innerHTML =
                '<p style="color:#888;padding:60px;text-align:center">加载失败，请刷新</p>';
        }
    }

    function renderCard(item) {
        const score = item.score || 3;
        const bars = Array.from({length: 5}, (_, i) =>
            `<span class="bar ${i < score ? 'on' : ''}"></span>`
        ).join('');
        const badge = item.recurring ? '<span class="card-badge">热议</span>' : '';
        const imgHtml = item.image
            ? `<img class="card-img" src="${item.image}" alt="" loading="lazy" onerror="this.style.display='none'">`
            : `<div class="card-img-placeholder">${item.source}</div>`;

        return `
        <article class="card">
            <a href="${item.url}" target="_blank" rel="noopener">
                <div class="card-img-wrap">${imgHtml}${badge}</div>
                <div class="card-body">
                    <h3 class="card-title">${item.title}</h3>
                    <p class="card-summary">${item.summary}</p>
                    <div class="card-footer">
                        <span class="card-source">${item.source}</span>
                        <div class="card-score">${bars}</div>
                    </div>
                </div>
            </a>
        </article>`;
    }

    loadFeed();
    </script>
</body>
</html>
