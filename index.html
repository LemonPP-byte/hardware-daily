<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大聪明硬件每日新鲜事</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --text-primary: #1a1a1a;
            --text-secondary: #666;
            --text-muted: #999;
            --border: #eee;
            --bg: #fff;
            --accent: #05CE78;
        }

        body {
            font-family: -apple-system, 'SF Pro Text', 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* === Layout === */
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* === Header === */
        header {
            padding: 80px 0 60px;
        }
        header h1 {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 16px;
        }
        header p {
            font-size: 15px;
            color: var(--text-muted);
            max-width: 400px;
        }

        /* === Day Section === */
        .day {
            margin-bottom: 64px;
        }
        .day-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 32px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .day-date {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .day-label {
            font-size: 12px;
            color: var(--accent);
            font-weight: 500;
        }

        /* === Item === */
        .item {
            margin-bottom: 36px;
            padding-bottom: 36px;
            border-bottom: 1px solid #f5f5f5;
        }
        .item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .item-number {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 8px;
            font-variant-numeric: tabular-nums;
        }
        .item-title {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 10px;
            letter-spacing: -0.3px;
        }
        .item-title a {
            color: var(--text-primary);
            text-decoration: none;
            transition: color 0.15s;
        }
        .item-title a:hover {
            color: var(--accent);
        }
        .item-summary {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.7;
        }
        .item-meta {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .item-source {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .item-link {
            font-size: 12px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
        .item-link:hover {
            text-decoration: underline;
        }

        /* === Footer === */
        footer {
            padding: 40px 0 60px;
            border-top: 1px solid var(--border);
            margin-top: 20px;
        }
        footer p {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* === Responsive === */
        @media (max-width: 640px) {
            header { padding: 48px 0 36px; }
            .item-title { font-size: 18px; }
            .day { margin-bottom: 48px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>大聪明硬件每日新鲜事</h1>
            <p>每天 3 条海外消费硬件新产品速递，自动追踪筛选，只看值得关注的。</p>
        </header>
        <main id="feed"></main>
        <footer>
            <p>数据来源：Product Hunt · Hacker News · Kickstarter · TechCrunch · Dezeen · Wired · Reddit</p>
        </footer>
    </div>

    <script>
    async function loadFeed() {
        try {
            const res = await fetch('./data.json');
            const days = await res.json();
            const feed = document.getElementById('feed');

            days.forEach(day => {
                const section = document.createElement('section');
                section.className = 'day';

                const dateStr = formatDate(day.date);
                const label = getLabel(day.date);

                section.innerHTML = `
                    <div class="day-header">
                        <span class="day-date">${dateStr}</span>
                        ${label ? `<span class="day-label">${label}</span>` : ''}
                    </div>
                `;

                day.items.forEach((item, i) => {
                    const el = document.createElement('div');
                    el.className = 'item';
                    el.innerHTML = `
                        <div class="item-number">0${i + 1}</div>
                        <h2 class="item-title">
                            <a href="${item.url}" target="_blank" rel="noopener noreferrer">${item.title}</a>
                        </h2>
                        <p class="item-summary">${item.summary}</p>
                        <div class="item-meta">
                            <span class="item-source">${item.source}</span>
                            <span style="color:#ddd">·</span>
                            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="item-link">查看原文 ↗</a>
                        </div>
                    `;
                    section.appendChild(el);
                });

                feed.appendChild(section);
            });
        } catch (err) {
            document.getElementById('feed').innerHTML = '<p style="color:#999;padding:40px 0">加载失败，请刷新重试</p>';
        }
    }

    function formatDate(dateStr) {
        const date = new Date(dateStr + 'T00:00:00');
        const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        return `${dateStr} ${weekdays[date.getDay()]}`;
    }

    function getLabel(dateStr) {
        const date = new Date(dateStr + 'T00:00:00');
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const diff = Math.floor((today - date) / 86400000);
        if (diff === 0) return '今天';
        if (diff === 1) return '昨天';
        return '';
    }

    loadFeed();
    </script>
</body>
</html>
