<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科技资讯 — 每日硬件新品速递</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --text: #1c1c1e;
            --muted: #8e8e93;
            --accent: #E8652B;
            --glass: rgba(255,255,255,0.6);
            --glass-border: rgba(255,255,255,0.5);
        }
        body {
            font-family: -apple-system, 'SF Pro Display', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
            background: #ffffff;
            color: var(--text);
            line-height: 1.5;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* === Subtle bg orbs === */
        .bg-layer {
            position: fixed; inset: 0; z-index: 0;
            overflow: hidden; pointer-events: none;
            background: #ffffff;
        }
        .bg-layer .orb {
            position: absolute; border-radius: 50%;
            filter: blur(100px);
            background: rgba(236,105,48,0.06);
            animation: drift 30s ease-in-out infinite;
        }
        .bg-layer .orb-1 { width: 700px; height: 700px; top: -15%; left: -10%; animation-duration: 25s; }
        .bg-layer .orb-2 { width: 500px; height: 500px; bottom: -10%; right: -5%; animation-delay: -10s; animation-duration: 32s; }
        .bg-layer .orb-3 { width: 450px; height: 450px; top: 35%; left: 40%; animation-delay: -18s; animation-duration: 28s; }
        @keyframes drift {
            0% { transform: translate(0,0) scale(1); }
            20% { transform: translate(50px,-60px) scale(1.06); }
            40% { transform: translate(-40px,50px) scale(0.94); }
            60% { transform: translate(70px,30px) scale(1.04); }
            80% { transform: translate(-50px,-40px) scale(0.96); }
            100% { transform: translate(0,0) scale(1); }
        }

        /* === Content === */
        .content-wrap { position: relative; z-index: 1; }

        /* === Top bar === */
        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 200;
            height: 44px; display: flex; align-items: center;
            justify-content: space-between; padding: 0 28px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }
        .top-bar-left { display: flex; align-items: center; gap: 8px; }
        .top-bar-left svg rect { fill: #EC6930; }
        .top-bar-left svg path { fill: #fff; }
        .top-bar-left span { font-size: 13px; font-weight: 600; color: var(--text); }
        .top-bar-right { font-size: 11px; color: var(--muted); }

        /* === Main === */
        main { padding: 56px 28px 48px; max-width: 1300px; margin: 0 auto; }

        /* === Day container === */
        .day {
            margin-bottom: 28px;
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 20px; padding: 24px 22px 28px;
        }
        .day.past { opacity: 0.7; }
        .day.past .card-brief,
        .day.past .headline-card-brief { opacity: 1; color: rgba(28,28,30,0.85); }
        .day.past .card-brief strong,
        .day.past .headline-card-brief strong { color: rgba(28,28,30,0.85); }
        .day-date {
            font-size: 11px; font-weight: 500;
            color: var(--muted); margin-top: 16px;
            text-align: center;
            padding-top: 12px;
            border-top: 1px solid rgba(0,0,0,0.04);
        }

        /* === 4-col layout: headline left (tall) + 3 tiers right === */
        .day-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1fr 1fr;
            gap: 16px;
            align-items: stretch;
        }
        /* === Headline column (left) === */
        .headline-col {
            display: flex; flex-direction: column; gap: 0;
        }
        .headline-col-header {
            border-radius: 14px; padding: 16px 20px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #d32f2f 0%, #e53935 30%, #ef9a9a 70%, #ffcdd2 100%);
            display: flex; flex-direction: column; gap: 2px;
        }
        .headline-col-header h2 {
            font-size: 22px; font-weight: 900; color: #fff;
            text-shadow: 0 1px 6px rgba(0,0,0,0.15);
        }
        .headline-col-header p {
            font-size: 11px; color: rgba(255,255,255,0.7);
        }
        .headline-card {
            background: #fff;
            border: 1px solid rgba(0,0,0,0.06);
            border-radius: 16px; overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex; flex-direction: column;
            height: 100%;
        }
        .headline-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        .headline-card a { text-decoration: none; color: inherit; display: flex; flex-direction: column; height: 100%; }
        .headline-card-img { width: 100%; flex: 1; min-height: 220px; object-fit: cover; display: block; }
        .headline-card-img-placeholder {
            width: 100%; flex: 1; min-height: 220px;
            background: linear-gradient(135deg, #fff5f0, #fee);
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; color: var(--accent); font-weight: 600;
        }
        .headline-card-body { padding: 18px 20px 20px; }
        .headline-card-brief {
            font-size: 17px; font-weight: 500; color: var(--text); line-height: 1.8;
        }
        .headline-card-brief strong { font-weight: 700; color: #E8520B; }
        .headline-card-meta {
            margin-top: 10px; font-size: 10px; color: var(--muted);
            display: flex; align-items: center; gap: 8px;
        }
        .headline-card-score { display: flex; gap: 3px; }
        .headline-card-score .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(0,0,0,0.08); }
        .headline-card-score .dot.on { background: var(--accent); }
        .headline-card-angle {
            margin-top: 12px; padding: 6px 10px;
            background: rgba(232,101,43,0.05);
            border-radius: 6px; border: 1px solid rgba(232,101,43,0.1);
            font-size: 10px; color: #666; line-height: 1.4;
        }
        .headline-card-angle strong { font-weight: 600; color: var(--accent); }
        /* === Tier columns === */
        .tier-col { display: flex; flex-direction: column; gap: 12px; }
        .tier-header {
            border-radius: 14px; padding: 16px 18px;
            overflow: hidden;
            display: flex; flex-direction: column; gap: 3px;
        }
        .tier-header h2 {
            font-size: 20px; font-weight: 900; color: #fff;
            text-shadow: 0 1px 6px rgba(0,0,0,0.12);
        }
        .tier-header p {
            font-size: 11px; color: rgba(255,255,255,0.65);
        }
        .tier-col:nth-child(2) .tier-header { background: linear-gradient(135deg, #2e7d32 0%, #43a047 30%, #a5d6a7 70%, #c8e6c9 100%); }
        .tier-col:nth-child(3) .tier-header { background: linear-gradient(135deg, #0d47a1 0%, #1e88e5 30%, #90caf9 70%, #bbdefb 100%); }
        .tier-col:nth-child(4) .tier-header { background: linear-gradient(135deg, #e65100 0%, #fb8c00 30%, #ffcc80 70%, #ffe0b2 100%); }

        /* Glass card */
        .card {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0,0,0,0.04);
            border-radius: 14px; overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        .card a { text-decoration: none; color: inherit; display: block; }
        .card-img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; }
        .card-img-placeholder {
            width: 100%; aspect-ratio: 16/10;
            background: linear-gradient(135deg, #f5f5f5, #eee);
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: #ccc;
        }
        .card-body { padding: 11px 13px 13px; }
        .card-brief { font-size: 12px; color: #444; line-height: 1.7; }
        .card-brief strong { font-weight: 700; color: var(--text); }
        .card-footer { margin-top: 7px; display: flex; align-items: center; justify-content: space-between; }
        .card-source { font-size: 10px; color: var(--muted); font-weight: 500; }
        .card-score { display: flex; gap: 3px; }
        .card-score .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(0,0,0,0.08); }
        .card-score .dot.on { background: var(--accent); }
        .card-badge { position: absolute; top: 6px; right: 6px; font-size: 9px; font-weight: 700; background: var(--accent); color: #fff; padding: 2px 6px; border-radius: 4px; }
        .card-img-wrap { position: relative; }
        .card-angle {
            margin-top: 8px; padding: 5px 9px;
            background: rgba(0,0,0,0.03);
            border-radius: 6px;
            font-size: 10px; color: #666; line-height: 1.4;
        }
        .card-angle strong { font-weight: 600; color: #444; }
        @media (max-width: 1200px) {
            .day-grid { grid-template-columns: 1fr 1fr; }
            .headline-col { grid-column: 1 / -1; }
            .headline-card { height: auto; }
            .headline-card-img { min-height: 180px; flex: none; aspect-ratio: 16/9; }
            main { padding: 52px 16px 40px; }
        }
        @media (max-width: 640px) {
            .day-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="bg-layer">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="content-wrap">
        <div class="top-bar">
            <div class="top-bar-left">
                <svg width="24" height="24" viewBox="0 0 36 36" fill="none">
                    <rect width="36" height="36" rx="8"/>
                    <path d="M20.5 8L13 19.5H17.5L15.5 28L23 16.5H18.5L20.5 8Z"/>
                </svg>
                <span>科技资讯 — 每日硬件新品速递</span>
            </div>
            <div class="top-bar-right" id="meta"></div>
        </div>

        <main id="feed"></main>
    </div>

    <script>
    const tierMeta = {
        '成熟品牌': '头部品牌动态',
        'AI 硬件': 'AI·3C·充电新品',
        '新锐产品': '高潜力新品'
    };
    // Smart reading-angle analysis based on content
    function getAngle(item) {
        const text = (item.brief || item.title || '').toLowerCase();
        if (/折扣|优惠|降价|促销|deal|sale|半价|立减/.test(text)) return '价格敏感度';
        if (/设计|美学|工业风|极简|形态|外观|材质|透明/.test(text)) return '设计差异化';
        if (/模块|维修|开源|开发者|diy|改装/.test(text)) return '可玩性与自由度';
        if (/ai|智能|机器人|大模型|chatgpt|gemini/.test(text)) return 'AI 场景落地';
        if (/生态|配件|magsafe|充电|兼容/.test(text)) return '生态协同';
        if (/痛点|解决|场景|便携|差旅/.test(text)) return '场景痛点';
        if (/社区|讨论|热议|争议|评论/.test(text)) return '社区声量';
        if (/续航|性能|吸力|独显/.test(text)) return '核心参数突破';
        if (/众筹|新品|首款|首发/.test(text)) return '品类开创性';
        if (/创意|跨界|概念|实验/.test(text)) return '概念验证';
        return '产品力分析';
    }

    async function loadFeed() {
        try {
            const res = await fetch('./data.json?_=' + Date.now());
            const days = await res.json();
            const feed = document.getElementById('feed');
            const meta = document.getElementById('meta');
            if (days.length > 0) meta.textContent = `更新于 ${days[0].date}`;

            days.forEach((day, dayIndex) => {
                const heroItem = day.items.find(i => i.tier === '每日头条');
                const regularItems = day.items.filter(i => i.tier !== '每日头条');

                const section = document.createElement('section');
                section.className = dayIndex === 0 ? 'day' : 'day past';
                const d = new Date(day.date + 'T00:00:00');
                const wk = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];

                // 3 tiers: 成熟品牌, AI 硬件, 新锐产品 (野生灵感 merge into 新锐产品)
                const tiers = { '成熟品牌': [], 'AI 硬件': [], '新锐产品': [] };
                regularItems.forEach(item => {
                    const t = item.tier || '新锐产品';
                    if (t === '野生灵感') tiers['新锐产品'].push(item);
                    else if (tiers[t]) tiers[t].push(item);
                    else tiers['新锐产品'].push(item);
                });

                let html = '<div class="day-grid">';

                // Left column: headline
                html += '<div class="headline-col">';
                html += '<div class="headline-col-header"><h2>每日头条</h2><p>今日最值得关注</p></div>';
                if (heroItem) {
                    html += renderHeadline(heroItem);
                }
                html += '</div>';

                // Right 3 columns, max 2 cards each
                const tierNames = ['成熟品牌', 'AI 硬件', '新锐产品'];
                tierNames.forEach(tierName => {
                    const items = (tiers[tierName] || []).slice(0, 2);
                    html += `<div class="tier-col">`;
                    html += `<div class="tier-header"><h2>${tierName}</h2><p>${tierMeta[tierName]||''}</p></div>`;
                    items.forEach(item => { html += renderCard(item); });
                    if (items.length === 0) html += '<p style="font-size:11px;color:#ccc;padding:12px;text-align:center">暂无</p>';
                    html += '</div>';
                });

                html += '</div>';
                html += `<div class="day-date">${day.date} · ${wk}</div>`;
                section.innerHTML = html;
                feed.appendChild(section);
            });
        } catch (err) {
            document.getElementById('feed').innerHTML = '<p style="color:#999;padding:60px;text-align:center">加载失败，请刷新</p>';
        }
    }
    function renderHeadline(item) {
        const score = item.score || 3;
        const dots = Array.from({length:5},(_,i)=>`<span class="dot ${i<score?'on':''}"></span>`).join('');
        const imgHtml = item.image
            ? `<img class="headline-card-img" src="${item.image}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=headline-card-img-placeholder>TODAY\\'S PICK</div>'">`
            : `<div class="headline-card-img-placeholder">TODAY'S PICK</div>`;
        const brief = (item.brief||item.title||'').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
        const angle = getAngle(item);
        return `<article class="headline-card"><a href="${item.url}" target="_blank" rel="noopener">${imgHtml}<div class="headline-card-body"><p class="headline-card-brief">${brief}</p><div class="headline-card-angle"><strong>切入点：</strong>${angle}</div><div class="headline-card-meta"><span>${item.source}</span><div class="headline-card-score">${dots}</div></div></div></a></article>`;
    }

    function renderCard(item) {
        const score = item.score || 3;
        const dots = Array.from({length:5},(_,i)=>`<span class="dot ${i<score?'on':''}"></span>`).join('');
        const badge = item.recurring ? '<span class="card-badge">热议</span>' : '';
        const imgHtml = item.image
            ? `<img class="card-img" src="${item.image}" alt="" loading="lazy" onerror="this.style.display='none'">`
            : `<div class="card-img-placeholder">${item.source}</div>`;
        const brief = (item.brief||item.title||'').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
        const angle = getAngle(item);
        return `<article class="card"><a href="${item.url}" target="_blank" rel="noopener"><div class="card-img-wrap">${imgHtml}${badge}</div><div class="card-body"><p class="card-brief">${brief}</p><div class="card-angle"><strong>切入点：</strong>${angle}</div><div class="card-footer"><span class="card-source">${item.source}</span><div class="card-score">${dots}</div></div></div></a></article>`;
    }

    loadFeed();
    </script>
</body>
</html>
