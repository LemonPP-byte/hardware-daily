<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>硬件产品新鲜事</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --muted: #888;
            --accent: #E8652B;
            --card-bg: #fafafa;
            --card-border: #eee;
        }
        body {
            font-family: -apple-system, 'SF Pro Display', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        header {
            padding: 28px 40px 20px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            border-bottom: 1px solid #f0f0f0;
        }
        header h1 {
            font-size: 18px;
            font-weight: 700;
        }
        header h1 span { color: var(--accent); }
        .header-meta { font-size: 12px; color: var(--muted); }

        /* Day section */
        .day {
            padding: 24px 40px 40px;
            border-bottom: 1px solid #f0f0f0;
        }
        .day-date {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 20px;
        }

        /* 3-column tier layout */
        .tier-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 24px;
        }
        .tier-col {}
        .tier-title {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
            padding-bottom: 12px;
            margin-bottom: 16px;
            border-bottom: 3px solid var(--accent);
        }
        .tier-col:nth-child(1) .tier-title { color: #2B7A4B; border-color: #2B7A4B; }
        .tier-col:nth-child(2) .tier-title { color: var(--accent); border-color: var(--accent); }
        .tier-col:nth-child(3) .tier-title { color: #6B5B8A; border-color: #6B5B8A; }

        /* Card */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 14px;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
        }
        .card a {
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .card-img {
            width: 100%;
            aspect-ratio: 16/10;
            object-fit: cover;
            display: block;
        }
        .card-img-placeholder {
            width: 100%;
            aspect-ratio: 16/10;
            background: linear-gradient(135deg, #f0f0f0, #e4e4e4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #bbb;
        }
        .card-body { padding: 12px 14px 14px; }
        .card-title {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-summary {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.7;
        }
        .card-footer {
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-source { font-size: 10px; color: var(--muted); font-weight: 500; }
        .card-score { display: flex; gap: 2px; }
        .card-score .bar {
            width: 10px; height: 3px; border-radius: 1.5px; background: #e0e0e0;
        }
        .card-score .bar.on { background: var(--accent); }
        .card-badge {
            position: absolute; top: 6px; right: 6px;
            font-size: 9px; font-weight: 700;
            background: var(--accent); color: #fff;
            padding: 2px 5px; border-radius: 3px;
        }
        .card-img-wrap { position: relative; }

        @media (max-width: 1024px) {
            .tier-grid { grid-template-columns: 1fr; }
            .day { padding: 20px 20px 32px; }
            header { padding: 20px 20px 16px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>硬件产品<span>新鲜事</span></h1>
        <span class="header-meta" id="meta"></span>
    </header>
    <main id="feed"></main>

    <script>
    async function loadFeed() {
        try {
            const res = await fetch('./data.json');
            const days = await res.json();
            const feed = document.getElementById('feed');
            const meta = document.getElementById('meta');
            if (days.length > 0) meta.textContent = `更新于 ${days[0].date}`;

            days.forEach(day => {
                const section = document.createElement('section');
                section.className = 'day';
                const d = new Date(day.date + 'T00:00:00');
                const wk = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];

                // Group by tier
                const tiers = { '成熟品牌': [], '新锐产品': [], '野生灵感': [] };
                day.items.forEach(item => {
                    const t = item.tier || '新锐产品';
                    if (tiers[t]) tiers[t].push(item);
                    else tiers['新锐产品'].push(item);
                });

                let html = `<div class="day-date">${day.date} · ${wk}</div>`;
                html += '<div class="tier-grid">';

                const tierNames = ['成熟品牌', '新锐产品', '野生灵感'];
                tierNames.forEach(tierName => {
                    const items = tiers[tierName] || [];
                    html += `<div class="tier-col">`;
                    html += `<div class="tier-title">${tierName}</div>`;
                    items.forEach(item => {
                        html += renderCard(item);
                    });
                    if (items.length === 0) {
                        html += '<p style="font-size:12px;color:#ccc;padding:20px 0">暂无</p>';
                    }
                    html += '</div>';
                });

                html += '</div>';
                section.innerHTML = html;
                feed.appendChild(section);
            });
        } catch (err) {
            document.getElementById('feed').innerHTML =
                '<p style="color:#888;padding:60px;text-align:center">加载失败，请刷新</p>';
        }
    }

    function renderCard(item) {
        const score = item.score || 3;
        const bars = Array.from({length: 5}, (_, i) =>
            `<span class="bar ${i < score ? 'on' : ''}"></span>`
        ).join('');
        const badge = item.recurring ? '<span class="card-badge">热议</span>' : '';
        const imgHtml = item.image
            ? `<img class="card-img" src="${item.image}" alt="" loading="lazy" onerror="this.style.display='none'">`
            : `<div class="card-img-placeholder">${item.source}</div>`;

        return `
        <article class="card">
            <a href="${item.url}" target="_blank" rel="noopener">
                <div class="card-img-wrap">${imgHtml}${badge}</div>
                <div class="card-body">
                    <h3 class="card-title">${item.title}</h3>
                    <p class="card-summary">${item.summary}</p>
                    <div class="card-footer">
                        <span class="card-source">${item.source}</span>
                        <div class="card-score">${bars}</div>
                    </div>
                </div>
            </a>
        </article>`;
    }

    loadFeed();
    </script>
</body>
</html>
