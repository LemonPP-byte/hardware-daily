<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大聪明硬件每日新鲜事</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#05CE78',
                        'brand-dark': '#028858',
                        'brand-light': '#E6FAF0',
                        dark: '#282828',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans SC', -apple-system, sans-serif; }
        .card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        }
        .card-img {
            transition: transform 0.3s ease;
        }
        .card:hover .card-img {
            transform: scale(1.05);
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-white min-h-screen">

    <!-- Nav -->
    <nav class="border-b border-gray-100 sticky top-0 z-50 bg-white">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-brand rounded-lg flex items-center justify-center">
                    <span class="text-white font-bold text-sm">DC</span>
                </div>
                <span class="font-bold text-dark text-lg tracking-tight">大聪明硬件每日新鲜事</span>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-sm text-gray-400" id="update-badge"></span>
                <a href="https://github.com/LemonPP-byte/hardware-daily" target="_blank"
                   class="text-xs text-gray-400 hover:text-brand transition-colors">GitHub</a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="bg-gradient-to-b from-brand-light to-white py-10 px-6">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-3xl md:text-4xl font-black text-dark leading-tight">
                每天 3 个值得关注的<br>
                <span class="text-brand">海外硬件新鲜事</span>
            </h1>
            <p class="mt-3 text-gray-500 text-base max-w-lg">
                自动追踪 Kickstarter、Product Hunt、Hacker News 等海外社区，AI 筛选最有消费洞察价值的硬件动态。
            </p>
        </div>
    </section>

    <!-- Feed -->
    <main class="max-w-6xl mx-auto px-6 py-10" id="feed"></main>

    <!-- Footer -->
    <footer class="border-t border-gray-100 mt-12">
        <div class="max-w-6xl mx-auto px-6 py-8 flex flex-col md:flex-row items-center justify-between gap-4">
            <p class="text-xs text-gray-400">
                © 大聪明硬件每日新鲜事 · 每日自动更新
            </p>
            <div class="flex flex-wrap gap-2">
                <span class="tag">Product Hunt</span>
                <span class="tag">Hacker News</span>
                <span class="tag">Kickstarter</span>
                <span class="tag">Indiegogo</span>
                <span class="tag">TechCrunch</span>
                <span class="tag">Dezeen</span>
                <span class="tag">Core77</span>
                <span class="tag">Wired</span>
                <span class="tag">Reddit</span>
            </div>
        </div>
    </footer>

    <style>
        .tag {
            @apply text-xs px-2.5 py-1 bg-gray-50 text-gray-400 rounded-full border border-gray-100;
        }
    </style>

    <script>
    async function loadFeed() {
        try {
            const res = await fetch('./data.json');
            const days = await res.json();
            const feed = document.getElementById('feed');
            const badge = document.getElementById('update-badge');

            if (days.length > 0) {
                badge.innerHTML = `<span class="inline-block w-2 h-2 bg-brand rounded-full mr-1.5 animate-pulse"></span>最近更新 ${days[0].date}`;
            }

            days.forEach((day, dayIndex) => {
                const section = document.createElement('section');
                section.className = 'mb-14 fade-in';
                section.style.animationDelay = `${dayIndex * 0.1}s`;

                // Date header - Kickstarter style
                const header = document.createElement('div');
                header.className = 'flex items-center gap-3 mb-6';
                header.innerHTML = `
                    <div class="w-1 h-8 bg-brand rounded-full"></div>
                    <div>
                        <h2 class="text-lg font-bold text-dark">${formatDate(day.date)}</h2>
                        <p class="text-xs text-gray-400">${day.items.length} 条新鲜事</p>
                    </div>
                `;
                section.appendChild(header);

                // Cards grid
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 md:grid-cols-3 gap-6';

                day.items.forEach((item, i) => {
                    const card = createCard(item, i);
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                feed.appendChild(section);
            });
        } catch (err) {
            console.error('Failed to load feed:', err);
            document.getElementById('feed').innerHTML = `
                <div class="text-center py-20">
                    <p class="text-gray-400">数据加载失败</p>
                    <p class="text-sm text-gray-300 mt-2">请刷新页面重试</p>
                </div>`;
        }
    }

    function createCard(item, index) {
        const card = document.createElement('article');
        card.className = 'card bg-white rounded-2xl overflow-hidden border border-gray-100';

        const sourceColors = {
            'Product Hunt': 'bg-orange-50 text-orange-600',
            'Hacker News': 'bg-amber-50 text-amber-700',
            'Kickstarter': 'bg-green-50 text-green-700',
            'Indiegogo': 'bg-pink-50 text-pink-600',
            'TechCrunch': 'bg-emerald-50 text-emerald-700',
            'Dezeen': 'bg-slate-50 text-slate-600',
            'Core77': 'bg-blue-50 text-blue-600',
            'Wired': 'bg-gray-100 text-gray-700',
            'The Verge': 'bg-purple-50 text-purple-600',
            'Reddit': 'bg-orange-50 text-orange-500',
        };
        const tagClass = sourceColors[item.source] || 'bg-gray-50 text-gray-600';

        card.innerHTML = `
            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="block">
                <div class="overflow-hidden aspect-[16/10]">
                    <img src="${item.image}" alt="${item.title}"
                         class="card-img w-full h-full object-cover"
                         loading="lazy"
                         onerror="this.src='https://placehold.co/600x375/f8f8f8/ccc?text=${encodeURIComponent(item.source)}'">
                </div>
            </a>
            <div class="p-5">
                <div class="mb-3">
                    <span class="text-xs font-medium px-2.5 py-1 rounded-full ${tagClass}">${item.source}</span>
                </div>
                <h3 class="font-bold text-dark text-[15px] leading-snug mb-2.5 line-clamp-2">
                    <a href="${item.url}" target="_blank" rel="noopener noreferrer"
                       class="hover:text-brand transition-colors duration-200">
                        ${item.title}
                    </a>
                </h3>
                <p class="text-sm text-gray-500 leading-relaxed line-clamp-3">${item.summary}</p>
                <div class="mt-4 pt-3 border-t border-gray-50">
                    <a href="${item.url}" target="_blank" rel="noopener noreferrer"
                       class="text-xs font-medium text-brand hover:text-brand-dark transition-colors inline-flex items-center gap-1">
                        查看原文
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                        </svg>
                    </a>
                </div>
            </div>
        `;

        return card;
    }

    function formatDate(dateStr) {
        const date = new Date(dateStr + 'T00:00:00');
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const diff = Math.floor((today - date) / (1000 * 60 * 60 * 24));
        const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        const dayLabel = weekdays[date.getDay()];

        if (diff === 0) return `今天 · ${dayLabel}`;
        if (diff === 1) return `昨天 · ${dayLabel}`;
        return `${dateStr} · ${dayLabel}`;
    }

    loadFeed();
    </script>
</body>
</html>
